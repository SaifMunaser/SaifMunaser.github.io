<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OW Explorer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="index.html">OW Explorer</a>
    <a href="index.html" class="btn btn-warning btn-sm me-1">Heroes</a>
    <a href="maps.html" class="btn btn-outline-light btn-sm">Maps</a>
  </nav>

  <div class="container mt-4">
    <h1>Heroes</h1>

    <input type="text" id="searchInput" class="form-control mb-2" placeholder="Search heroes..." oninput="loadHeroes()">

    <button class="btn btn-warning btn-sm me-1" onclick="roleFilter='all'; loadHeroes()">All</button>
    <button class="btn btn-outline-secondary btn-sm me-1" onclick="roleFilter='tank'; loadHeroes()">Tank</button>
    <button class="btn btn-outline-secondary btn-sm me-1" onclick="roleFilter='damage'; loadHeroes()">Damage</button>
    <button class="btn btn-outline-secondary btn-sm" onclick="roleFilter='support'; loadHeroes()">Support</button>

    <p id="heroCount" class="mt-2"></p>
    <div id="heroGrid" class="row g-3"></div>

    <div class="mt-3 mb-5">
      <button id="prevBtn" class="btn btn-outline-light btn-sm" onclick="currentPage--; loadHeroes()" disabled>Previous</button>
      <span id="pageInfo" class="mx-2"></span>
      <button id="nextBtn" class="btn btn-outline-light btn-sm" onclick="currentPage++; loadHeroes()">Next</button>
    </div>
  </div>

  <script>
    let allHeroes = [];
    let roleFilter = "all";
    let currentPage = 0;
    const perPage = 18;

    async function fetchHeroes() {
      let response = await fetch("https://overfast-api.tekrop.fr/heroes");
      let data = await response.json();
      allHeroes = data;
      loadHeroes();
    }

    function loadHeroes() {
      let search = document.getElementById("searchInput").value.toLowerCase();

      let filtered = allHeroes.filter(function(h) {
        return (roleFilter === "all" || h.role === roleFilter) && h.name.toLowerCase().includes(search);
      });

      let totalPages = Math.ceil(filtered.length / perPage);
      if (currentPage >= totalPages) currentPage = 0;
      let slice = filtered.slice(currentPage * perPage, currentPage * perPage + perPage);

      document.getElementById("heroCount").textContent = filtered.length + " heroes found";
      document.getElementById("pageInfo").textContent = "Page " + (currentPage + 1) + " of " + (totalPages || 1);
      document.getElementById("prevBtn").disabled = currentPage === 0;
      document.getElementById("nextBtn").disabled = currentPage >= totalPages - 1;

      let html = "";
      slice.forEach(function(h) {
        let color = h.role === "tank" ? "primary" : h.role === "damage" ? "danger" : "success";
        html += '<div class="col-6 col-sm-4 col-md-2">'
          + '<div class="card ow-card text-center p-2">'
          + '<img src="' + h.portrait + '" class="card-img-top">'
          + '<p class="mt-2 mb-1">' + h.name + '</p>'
          + '<span class="badge bg-' + color + '">' + h.role + '</span>'
          + '</div></div>';
      });
      document.getElementById("heroGrid").innerHTML = html;
    }

    fetchHeroes();
  </script>

</body>
</html>
