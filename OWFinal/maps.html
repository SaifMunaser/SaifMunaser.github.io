<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OW Explorer - Maps</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="index.html">OW Explorer</a>
    <a href="index.html" class="btn btn-outline-light btn-sm me-1">Heroes</a>
    <a href="maps.html" class="btn btn-warning btn-sm">Maps</a>
  </nav>

  <div class="container mt-4">
    <h1>Maps</h1>

    <input type="text" id="searchInput" class="form-control mb-2" placeholder="Search maps..." oninput="loadMaps()">

    <button class="btn btn-warning btn-sm me-1" onclick="modeFilter='all'; loadMaps()">All</button>
    <button class="btn btn-outline-secondary btn-sm me-1" onclick="modeFilter='escort'; loadMaps()">Escort</button>
    <button class="btn btn-outline-secondary btn-sm me-1" onclick="modeFilter='hybrid'; loadMaps()">Hybrid</button>
    <button class="btn btn-outline-secondary btn-sm me-1" onclick="modeFilter='control'; loadMaps()">Control</button>
    <button class="btn btn-outline-secondary btn-sm me-1" onclick="modeFilter='flashpoint'; loadMaps()">Flashpoint</button>
    <button class="btn btn-outline-secondary btn-sm" onclick="modeFilter='push'; loadMaps()">Push</button>

    <p id="mapCount" class="mt-2"></p>
    <div id="mapGrid" class="row g-3"></div>

    <div class="mt-3 mb-5">
      <button id="prevBtn" class="btn btn-outline-light btn-sm" onclick="currentPage--; loadMaps()" disabled>Previous</button>
      <span id="pageInfo" class="mx-2"></span>
      <button id="nextBtn" class="btn btn-outline-light btn-sm" onclick="currentPage++; loadMaps()">Next</button>
    </div>
  </div>

  <script>
    let allMaps = [];
    let modeFilter = "all";
    let currentPage = 0;
    const perPage = 18;

    async function fetchMaps() {
      let response = await fetch("https://overfast-api.tekrop.fr/maps");
      let data = await response.json();
      allMaps = data;
      loadMaps();
    }

    function loadMaps() {
      let search = document.getElementById("searchInput").value.toLowerCase();

      let filtered = allMaps.filter(function(m) {
        return (modeFilter === "all" || m.gamemodes.includes(modeFilter)) && m.name.toLowerCase().includes(search);
      });

      let totalPages = Math.ceil(filtered.length / perPage);
      if (currentPage >= totalPages) currentPage = 0;
      let slice = filtered.slice(currentPage * perPage, currentPage * perPage + perPage);

      document.getElementById("mapCount").textContent = filtered.length + " maps found";
      document.getElementById("pageInfo").textContent = "Page " + (currentPage + 1) + " of " + (totalPages || 1);
      document.getElementById("prevBtn").disabled = currentPage === 0;
      document.getElementById("nextBtn").disabled = currentPage >= totalPages - 1;

      let html = "";
      slice.forEach(function(m) {
        html += '<div class="col-12 col-sm-6 col-md-3">'
          + '<div class="card ow-card p-0" onclick="location.href=\'map-detail.html?key=' + m.key + '\'" style="cursor:pointer">'
          + '<img src="' + m.screenshot + '" class="card-img-top map-img">'
          + '<div class="p-2">'
          + '<p class="mb-1">' + m.name + '</p>'
          + '<p class="mb-1 small">' + m.location + '</p>'
          + '<p class="mb-0 text-warning small">' + m.gamemodes.join(", ") + '</p>'
          + '</div></div></div>';
      });
      document.getElementById("mapGrid").innerHTML = html;
    }

    fetchMaps();
  </script>

</body>
</html>
