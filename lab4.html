<!DOCTYPE html>
<html>
<head>
    <title>CSC 225 Lab 4 - Store Order</title>
</head>
<body>
    <nav style="background:#343a40; padding:12px;">
        <a href="index.html" style="color:white; text-decoration:none; font-weight:bold;">
            Home
        </a>
    </nav>

    <div style="padding:20px;">
        <h1 id="greeting"></h1>
        <p id="name"></p>
        <p id="item"></p>
        <p id="quantity"></p>
        <p id="arrival"></p>
    </div>

    <script>
        alert("Welcome to the store!");

        let customerName = prompt("Enter your name:");

        let itemRequested = prompt("Enter the item you want to order (apples or oranges):");
        while (itemRequested !== "apples" && itemRequested !== "oranges") {
            itemRequested = prompt("Invalid item. Please enter only apples or oranges:");
        }

        let numberOfItems = prompt("Enter the number of items you want (1-99):");
        while (numberOfItems < 1 || numberOfItems > 99 || isNaN(numberOfItems)) {
            numberOfItems = prompt("Invalid amount. Enter a number between 1 and 99:");
        }

        let today = new Date();
        let hour = today.getHours();
        let greetingMessage = "";

        if (hour < 12) {
            greetingMessage = "Good Morning " + customerName + ", Thank you for Ordering!";
        } else if (hour < 18) {
            greetingMessage = "Good Afternoon " + customerName + ", Thank you for Ordering!";
        } else {
            greetingMessage = "Good Evening " + customerName + ", Thank you for Ordering!";
        }

        let arrivalDate = new Date();
        arrivalDate.setDate(arrivalDate.getDate() + 7);

        document.getElementById("greeting").innerHTML = greetingMessage;
        document.getElementById("name").innerHTML = "Customer Name: " + customerName;
        document.getElementById("item").innerHTML = "Item Ordered: " + itemRequested;
        document.getElementById("quantity").innerHTML = "Quantity Ordered: " + numberOfItems;
        document.getElementById("arrival").innerHTML = "Expected Arrival Date: " + arrivalDate.toDateString();
    </script>
</body>
</html>
