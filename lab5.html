<!doctype html>
<html>
<head>
  <title>Lab 5</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4">
  <h3>Registration Page</h3>

  <form onsubmit="return registerUser()">
    <label>First Name</label>
    <input type="text" id="firstName" class="form-control">

    <label>Last Name</label>
    <input type="text" id="lastName" class="form-control">

    <label>Email Address</label>
    <input type="text" id="email" class="form-control">

    <label>Password</label>
    <input type="password" id="password" class="form-control">

    <label>Date of Birth</label>
    <input type="date" id="dob" class="form-control">

    <br>
    <button type="submit" class="btn btn-secondary">Register</button>
  </form>

  <br>
  <div id="output"></div>
</div>

<script>
function registerUser() {
  let user = {
    firstName: document.getElementById("firstName").value,
    lastName: document.getElementById("lastName").value,
    email: document.getElementById("email").value,
    password: document.getElementById("password").value,
    dob: document.getElementById("dob").value
  };

  let output = document.getElementById("output");

  if (user.firstName == "" || user.lastName == "" || user.email == "" || user.password == "" || user.dob == "") {
    output.innerHTML = "Registration Failed<br>All fields must be filled out.";
    return false;
  }

  if (user.password.includes("!") == false && user.password.includes("?") == false) {
    output.innerHTML = "Registration Failed<br>Password must contain at least 1 ! or ?";
    return false;
  }

  user.password = "*".repeat(user.password.length);

  output.innerHTML =
    "Registration Successful<br><br>" +
    "First Name: " + user.firstName + "<br>" +
    "Last Name: " + user.lastName + "<br>" +
    "Email Address: " + user.email + "<br>" +
    "Password: " + user.password + "<br>" +
    "Date of Birth: " + user.dob;

  return false;
}
</script>

</body>
</html>
